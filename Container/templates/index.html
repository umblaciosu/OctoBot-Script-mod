<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 1.5em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Command Received</h1>
    {% if command %}
        <p>{{ command }}</p>
    {% else %}
        <p>No command received yet.</p>
    {% endif %}
</body>
</html>
